    actions: []
  - id: choose-customer
    chapter: Add the order
    title: Choose the customer
    caption: Choose the customer.
    page_text: Click **Customer** and choose the person who's ordering.
    actions: []
  - id: enter-quantity
    chapter: Add the order
    title: Enter the quantity
    caption: Enter how many they want.
    page_text: Enter the **Quantity**. The total updates as you type.
    actions: []
  - id: save-draft
    chapter: Add the order
    title: Save draft

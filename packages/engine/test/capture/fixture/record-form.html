<!doctype html>
<html><head><title>Add competitor</title></head>
<body>
  <main>
    <h1>Add competitor</h1>
    <form action="/record-done.html" method="get">
      <label for="first">First name <span>Required</span></label>
      <input id="first" name="first">
      <label>Email <input id="email" name="email" type="email"></label>
      <label for="class">Class</label>

      <label><input type="checkbox" name="paid"> Paid</label>
      <button type="submit">Save competitor</button>
    </form>
  </main>
</body></html>

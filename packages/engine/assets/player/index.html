<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>aida walkthrough player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div id="frame">
    <section class="card" id="intro">
      <div class="panel" id="intro-panel">
        <div class="brand" id="intro-brand"><img id="brand-logo" alt="" style="display:none"><span id="brand-name"></span></div>
        <span class="eyebrow-pill" id="intro-eyebrow"></span>
        <h1 id="intro-title"></h1>
        <p class="sub" id="intro-sub"></p>
        <div class="facts" id="intro-facts"></div>
      </div>
      <div class="hero" id="intro-hero"><img id="intro-hero-img" alt=""></div>
    </section>

    <div id="window">
      <div id="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="url"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="5" y="11" width="14" height="10" rx="2"/></svg><span id="chrome-url"></span></span></div>
      <div id="stage">
        <div id="cam">
          <img id="imgA" alt="">
          <img id="imgB" alt="">
          <div id="blurLayer"></div>
          <div id="spot"><i class="corner c-tl"></i><i class="corner c-tr"></i><i class="corner c-bl"></i><i class="corner c-br"></i><span class="badge" id="spot-badge"></span></div>
          <div id="calloutLayer"></div>
          <svg id="cursor" viewBox="0 0 30 30" aria-hidden="true">
            <circle class="halo" cx="4" cy="4" r="12"/>
            <path d="M3 2 L3 24 L9 18.5 L13 27 L17 25.2 L13 17 L21 17 Z" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </div>
        <div id="calloutLegend"></div>
      </div>
    </div>

    <section class="card" id="outro">
      <div class="panel" id="outro-panel">
        <div class="brand" id="outro-brand"><img id="outro-logo" alt="" style="display:none"><span id="outro-brand-name"></span></div>
        <h1 id="outro-title"></h1>
        <div class="recap" id="outro-recap"></div>
        <div class="foot" id="outro-foot"><span id="outro-site"></span><span id="outro-tagline"></span></div>
      </div>
      <div class="hero" id="outro-hero"><img id="outro-hero-img" alt=""></div>
    </section>

    <div id="band">
      <div id="chip"><span class="num"></span><div class="text"><div class="eyebrow"></div><div class="title"></div></div></div>
      <div id="caption"></div>
    </div>
  </div>
  <script src="timeline.js"></script>
  <script src="player.js"></script>
</body>
</html>
